[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "1.0.0"
description = "AI-Powered Penetration Testing Recon & Report Platform"
requires-python = ">=3.10"

[project.scripts]
sentinel = "sentinel.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
